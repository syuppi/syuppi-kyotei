{% extends "base.html" %}
{% block title %}本日の予測 — BOAT FORECAST{% endblock %}
{% block content %}
<section class="hero-panel">
  <p class="eyebrow">Daily Predictions</p>
  <h1>本日の各レース予測</h1>
  <p class="lede">まず出走表を取得し、「全場を予想」で自信度を付けます。場を選ぶとその場だけの解析・表示もできます。初回起動やスリープ復帰後は1〜2分かかることがあります。</p>
  <div class="controls">
    <label>日付 <input type="date" id="day" /></label>
    <label>場
      <select id="venue">
        <option value="">場を選択…</option>
      </select>
    </label>
    <label class="check-label" title="自信ありレースがある場だけを場リストに出します">
      <span>自信ありの場のみ</span>
      <input type="checkbox" id="venue-confident-only" />
    </label>
    <label>表示
      <select id="hit-filter">
        <option value="all">すべて</option>
        <option value="confident">自信ありのみ</option>
        <option value="any_hit">的中のみ（いずれか）</option>
        <option value="win_hit">単勝的中のみ</option>
        <option value="trio_hit">3連複的中のみ</option>
        <option value="trifecta_hit">3連単的中のみ</option>
        <option value="miss">外れのみ</option>
        <option value="pending">未確定のみ</option>
      </select>
    </label>
    <label>並び
      <select id="hit-sort">
        <option value="venue">場→レース順</option>
        <option value="confidence">自信度順</option>
        <option value="hit_desc">的中優先</option>
        <option value="hit_asc">外れ優先</option>
        <option value="race_no">レース番号順</option>
      </select>
    </label>
    <label class="check-label">
      <span>コンパクト</span>
      <input type="checkbox" id="compact-mode" checked />
    </label>
    <button type="button" id="predict-all" class="btn btn-primary" hidden>全場を予想</button>
    <button id="refresh" class="btn" disabled>この場を解析</button>
    <button type="button" id="page-reload" class="btn btn-secondary" title="ブラウザの更新の代わり（ホーム画面追加時）">ページ更新</button>
  </div>
  <div id="fetch-progress" class="fetch-progress" hidden role="status" aria-live="polite">
    <div class="fetch-progress-inner">
      <span class="fetch-spinner" aria-hidden="true"></span>
      <div class="fetch-progress-text">
        <strong id="fetch-progress-title">取得中…</strong>
        <p id="fetch-progress-detail" class="meta"></p>
      </div>
    </div>
  </div>
  <div id="fetch-done-banner" class="fetch-done-banner" hidden role="status" aria-live="polite">
    <span id="fetch-done-message">取得が完了しました。</span>
    <button type="button" id="fetch-done-predict" class="btn btn-primary btn-sm" hidden>全場を予想</button>
    <button type="button" id="fetch-done-reload" class="btn btn-secondary btn-sm">ページ更新</button>
    <button type="button" id="fetch-done-continue" class="btn btn-sm">このまま続ける</button>
  </div>
  <p id="load-status" class="meta load-status" style="margin-top:0.6rem"></p>
</section>

<section id="summary" class="summary-row"></section>
<section id="ticket-rank-stats" class="ticket-rank-panel" hidden></section>
<section id="list" class="race-list" aria-live="polite"></section>
{% endblock %}
{% block scripts %}
<script src="/static/app.js?v=hit-verify-trends-1"></script>
<script>
  bootPredictions();
</script>
{% endblock %}
