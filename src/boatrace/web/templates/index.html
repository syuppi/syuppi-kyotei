{% extends "base.html" %}
{% block title %}本日の予測 — BOAT FORECAST{% endblock %}
{% block content %}
<section class="hero-panel">
  <p class="eyebrow">Daily Predictions</p>
  <h1>本日の各レース予測</h1>
  <p class="lede">場を選んでから解析します。自信ありレースだけに絞ることもできます。未発走でも出走表・展示・天候が揃えば自信度が付きます。</p>
  <div class="controls">
    <label>日付 <input type="date" id="day" /></label>
    <label>場
      <select id="venue">
        <option value="">場を選択…</option>
      </select>
    </label>
    <label class="check-label" title="自信ありレースがある場だけを場リストに出します">
      <span>自信ありの場のみ</span>
      <input type="checkbox" id="venue-confident-only" />
    </label>
    <label>表示
      <select id="hit-filter">
        <option value="all">すべて</option>
        <option value="confident">自信ありのみ</option>
        <option value="any_hit">的中のみ（いずれか）</option>
        <option value="win_hit">単勝的中のみ</option>
        <option value="trio_hit">3連複的中のみ</option>
        <option value="trifecta_hit">3連単的中のみ</option>
        <option value="miss">外れのみ</option>
        <option value="pending">未確定のみ</option>
      </select>
    </label>
    <label>並び
      <select id="hit-sort">
        <option value="venue">場→レース順</option>
        <option value="confidence">自信度順</option>
        <option value="hit_desc">的中優先</option>
        <option value="hit_asc">外れ優先</option>
        <option value="race_no">レース番号順</option>
      </select>
    </label>
    <label class="check-label">
      <span>コンパクト</span>
      <input type="checkbox" id="compact-mode" checked />
    </label>
    <button id="refresh" class="btn" disabled>この場を解析</button>
  </div>
  <p id="load-status" class="meta" style="margin-top:0.6rem"></p>
</section>

<section id="summary" class="summary-row"></section>
<section id="list" class="race-list" aria-live="polite"></section>
{% endblock %}
{% block scripts %}
<script src="/static/app.js?v=confident-venue-filter-1"></script>
<script>
  bootPredictions();
</script>
{% endblock %}
