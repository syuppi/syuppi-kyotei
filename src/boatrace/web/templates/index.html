{% extends "base.html" %}
{% block title %}本日の予測 — BOAT FORECAST{% endblock %}
{% block content %}
<section class="hero-panel">
  <p class="eyebrow">Daily Predictions</p>
  <h1>本日の各レース予測</h1>
  <p class="lede">号艇別の1着・2連対・3連対確率と、予測理由を一覧表示します。</p>
  <div class="controls">
    <label>日付 <input type="date" id="day" /></label>
    <label>場
      <select id="venue">
        <option value="">すべて</option>
      </select>
    </label>
    <button id="refresh" class="btn">再予測</button>
  </div>
</section>

<section id="summary" class="summary-row"></section>
<section id="list" class="race-list" aria-live="polite"></section>
{% endblock %}
{% block scripts %}
<script src="/static/app.js"></script>
<script>
  bootPredictions();
</script>
{% endblock %}
