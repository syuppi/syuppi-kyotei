<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="BOAT FORECAST" />
  <title>{% block title %}ボートレース予想{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=IBM+Plex+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bg-grid"></div>
  <header class="site-header">
    <a class="brand" href="/">BOAT<span>FORECAST</span></a>
    <nav>
      <a href="/">本日の予測</a>
      <a href="/venues">場の傾向</a>
      <a href="/search">条件検索</a>
      <a href="/accuracy">精度検証</a>
      <button type="button" id="header-reload" class="btn-header-reload" title="ページを更新（ホーム画面追加時はこちら）" hidden>↻ 更新</button>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>場ごとのクセを学習し、説明可能なスコアで予測します。</p>
  </footer>
  {% block scripts %}{% endblock %}
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var btn = document.getElementById("header-reload");
      if (!btn) return;
      var isPwa = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
      var isMobile = window.matchMedia("(max-width: 640px)").matches;
      if (isPwa || isMobile) btn.hidden = false;
      btn.addEventListener("click", function () { window.location.reload(); });
    });
  </script>
</body>
</html>
