[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boatrace-predict"
version = "0.1.0"
description = "ボートレース予想システム（場別継続学習）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.2",
  "httpx>=0.27.2",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.3.0",
  "pandas>=2.2.3",
  "numpy>=2.1.0",
  "scikit-learn>=1.5.2",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.12",
  "tenacity>=9.0.0",
  "structlog>=24.4.0",
  "typer>=0.12.5",
  "rich>=13.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]
ml = ["lightgbm>=4.5.0", "joblib>=1.4.0"]

[project.scripts]
boatrace = "boatrace.cli.app:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
